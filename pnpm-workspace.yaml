packages:
  - apps/*
  - packages/*

# Supply-chain hardening: don't install versions published less than a day ago.
minimumReleaseAge: 1440

# Only these dependencies may run install scripts.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Optional native/postinstall steps pulled in by testcontainers; pure-JS fallbacks work.
  cpu-features: false
  protobufjs: false
  ssh2: false
