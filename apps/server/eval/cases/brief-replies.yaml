          Reply "watched it" once you've caught up on all of these.
    expect:
      writes: &two-eps-all
        - anime: "Yomi no Tsugai"
          episodes_watched: 19

  - id: brief-two-eps-just-saw-it
    message: "just saw it"
    tags: [brief-reply]
    history: *two-eps
    expect: { writes: *two-eps-all }

  - id: brief-two-eps-caught-up-on-them
    message: "caught up on them"
