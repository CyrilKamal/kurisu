# Replies to the morning brief. Wordings and labels are the user's (2026-10-06); each brief is
# written once (&anchor) and reused (*anchor).
snapshot: my-list
cases:
  # Case 1: a stacked weekend. Wistoria S2 9/12, Yomi no Tsugai (Daemons) 17/24, Clevatess II 1/13.
  - id: brief-weekend-done
    message: "done"
    tags: [brief-reply, multi]
    history: &weekend
      - role: assistant
        content: |
          Three shows have new episodes.

          - Tsue to Tsurugi no Wistoria Season 2 eps 10–11
          - Yomi no Tsugai ep 18
          - Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou ep 2

          Reply "watched it" once you've caught up on all of these.
    expect:
      writes: &weekend-all
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 11
        - anime: "Yomi no Tsugai"
          episodes_watched: 18
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 2

  - id: brief-weekend-watched-them-all
    message: "watched them all"
    tags: [brief-reply, multi]
    history: *weekend
    expect: { writes: *weekend-all }

  - id: brief-weekend-finished
    message: "finished"
    tags: [brief-reply, multi]
    history: *weekend
    expect: { writes: *weekend-all }

  - id: brief-weekend-caught-up-now
    message: "caught up now"
    tags: [brief-reply, multi]
    history: *weekend
    expect: { writes: *weekend-all }

  - id: brief-weekend-saw-them
    message: "saw them"
    tags: [brief-reply, multi]
    history: *weekend
    expect: { writes: *weekend-all }

  - id: brief-weekend-watched-it
    message: "watched it"
    tags: [brief-reply, multi]
    history: *weekend
    expect: { writes: *weekend-all }

  - id: brief-weekend-wistoria-and-daemons
    message: "watched wistoria eps and daemons"
    tags: [brief-reply, multi, nickname]
    history: *weekend
    expect:
      writes:
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 11
        - anime: "Yomi no Tsugai"
          episodes_watched: 18

  - id: brief-weekend-daemons-and-clevatess
    message: "watched daemons and clevatess"
    tags: [brief-reply, multi, nickname]
    history: *weekend
    expect:
      writes:
        - anime: "Yomi no Tsugai"
          episodes_watched: 18
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 2

  - id: brief-weekend-a-wistoria-ep-and-the-other-two
    message: "watched a wistoria ep and the other two"
    tags: [brief-reply, multi, relative]
    history: *weekend
    expect:
      writes: &weekend-one-wistoria
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 10
        - anime: "Yomi no Tsugai"
          episodes_watched: 18
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 2

  - id: brief-weekend-a-wistoria-ep-and-the-others
    message: "watched a wistoria ep and the others"
    tags: [brief-reply, multi, relative]
    history: *weekend
    expect: { writes: *weekend-one-wistoria }

  - id: brief-weekend-wistoria
    message: "watched wistoria"
    tags: [brief-reply]
    history: *weekend
    expect:
      writes:
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 11

  - id: brief-weekend-the-2nd-ep
    message: "watched the 2nd ep"
    tags: [brief-reply]
    notes: "A trick: the episode numbered 2 (Clevatess), not the second show in the list."
    history: *weekend
    expect:
      writes:
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 2

  - id: brief-weekend-didnt-watch-any-yet
    message: "didnt watch any yet"
    tags: [brief-reply, no-action]
    history: *weekend
    expect: { writes: [] }

  - id: brief-weekend-havent-seen-them
    message: "havent seen them"
    tags: [brief-reply, no-action]
    history: *weekend
    expect: { writes: [] }

  - id: brief-weekend-wistoria-and-drop-clevatess
    message: "watched the wistoria eps but didnt like clevatess dropping"
    tags: [brief-reply, multi]
    history: *weekend
    expect:
      writes:
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 11
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          status: dropped

  # Case 2: one show with two new episodes. Yomi no Tsugai 17/24.
  - id: brief-two-eps-watched-the-eps
    message: "Watched the eps"
    tags: [brief-reply]
    history: &two-eps
      - role: assistant
        content: |
          Yomi no Tsugai has 2 new episodes.

