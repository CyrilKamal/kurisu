  # Case 4: a finale. Wistoria S2 9/12; ep 12 is its last.
  - id: brief-finale-only-one-ep
    message: "only watched one ep"
    tags: [brief-reply, relative]
    notes: "One episode, so the show isn't finished."
    history: &finale
      - role: assistant
        content: |
          Wistoria wraps up.

          - Tsue to Tsurugi no Wistoria Season 2 eps 10–12 (finale)

          Reply "watched it" once you've caught up on all of these.
    expect:
      writes:
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 10

  - id: brief-finale-watched-them
    message: "watched them"
    tags: [brief-reply]
    history: *finale
    expect:
      writes: &finale-done
        - anime: "Tsue to Tsurugi no Wistoria Season 2"
          episodes_watched: 12

  - id: brief-finale-finished-it
    message: "finished it"
    tags: [brief-reply]
    history: *finale
    expect: { writes: *finale-done }

  - id: brief-finale-finished-the-show
    message: "finished the show"
    tags: [brief-reply]
    history: *finale
    expect: { writes: *finale-done }

  # Case 5: behind. Clevatess II 1/13 (the brief lists ep 5), Yomi no Tsugai 17/24.
  - id: brief-behind-3-clevatess-and-daemons
    message: "watched 3 clevatess and daemons"
    tags: [brief-reply, multi, relative, nickname]
    notes: "3 more episodes of Clevatess (the user's call), so ep 4."
    history: &behind
      - role: assistant
        content: |
          Two shows have new episodes.

          - Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou ep 5. You're on ep 1.
          - Yomi no Tsugai ep 18

          Reply "watched it" once you've caught up on all of these.
    expect:
      writes:
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 4
        - anime: "Yomi no Tsugai"
          episodes_watched: 18

  - id: brief-behind-caught-up-on-clevatess
    message: "caught up on clevatess"
    tags: [brief-reply]
    history: *behind
    expect:
      writes:
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
          episodes_watched: 5

  - id: brief-behind-watched-it
    message: "watched it"
    tags: [brief-reply, multi]
    history: *behind
    expect:
      writes: &behind-all
        - anime: "Clevatess II: Majuu no Ou to Itsuwari no Yuusha Denshou"
