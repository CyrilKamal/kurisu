# The hosted kurisu. Run through deploy/deploy.sh, or by hand from the repo root:
#   docker compose -f deploy/compose.yaml --env-file .env.prod up -d --build --wait
# Its own project name keeps it apart from the dev database (docker-compose.yml, project "kurisu").
# On a server, COMPOSE_PROFILES=public in .env.prod also starts Caddy (HTTPS on KURISU_DOMAIN) and
# the off-site copy of the backups (deploy/README.md, "Running on a server").
name: kurisu-prod

services:
  db:
    image: pgvector/pgvector:pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    ports:
      # Loopback only, for the one-time data copy and `pnpm review`; never on the network.
      - "127.0.0.1:${PROD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped
    env_file: ../.env.prod
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/db').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://server:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://server:4000
    ports:
      # Loopback only. On the PC, Tailscale Funnel publishes it (`tailscale funnel --bg 3080`); on
      # a server, Caddy reaches the web app over the compose network instead.
      - "127.0.0.1:${PROD_WEB_PORT:-3080}:3000"
    depends_on:
      server:
        condition: service_healthy

  backup:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup.sh:/backup.sh:ro
      # Defaults to backups/ beside the repo checkout; point BACKUP_DIR somewhere synced
      # (OneDrive, say) to keep a copy off this PC.
      - ${BACKUP_DIR:-../backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      # After the server, so the first dump comes after its migrations.
      server:
        condition: service_healthy

  caddy:
    profiles: [public]
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      KURISU_DOMAIN: ${KURISU_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Copies the daily dumps to S3-compatible storage (DigitalOcean Spaces, Backblaze B2), so a lost
  # server doesn't take its backups with it, and keeps 30 days there.
  offsite:
    profiles: [public]
    image: rclone/rclone:1.73@sha256:1619a625f845e169c34b952cf40c483c0392965b821c5155cde8cbfd35254a96
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - ${BACKUP_DIR:-../backups}:/backups:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if rclone copy /backups "offsite:$$BACKUP_S3_BUCKET/kurisu" --include 'kurisu-*.dump' &&
            rclone delete "offsite:$$BACKUP_S3_BUCKET/kurisu" --min-age 30d; then
            echo "offsite: copied"
          else
            echo "offsite: copy failed" >&2
          fi
          sleep 21600
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
