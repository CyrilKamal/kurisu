# The hosted kurisu. Run through deploy/deploy.ps1, or by hand from the repo root:
#   docker compose -f deploy/compose.yaml --env-file .env.prod up -d --build --wait
# Its own project name keeps it apart from the dev database (docker-compose.yml, project "kurisu").
name: kurisu-prod

services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    ports:
      # Loopback only, for the one-time data copy and `pnpm review`; never on the network.
      - "127.0.0.1:${PROD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped
    env_file: ../.env.prod
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/db').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://server:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://server:4000
    ports:
      # Tailscale Funnel publishes this port: `tailscale funnel --bg 3080`.
      - "127.0.0.1:${PROD_WEB_PORT:-3080}:3000"
    depends_on:
      server:
        condition: service_healthy

  backup:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup.sh:/backup.sh:ro
      # Defaults to backups/ beside the repo checkout; point BACKUP_DIR somewhere synced
      # (OneDrive, say) to keep a copy off this PC.
      - ${BACKUP_DIR:-../backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      # After the server, so the first dump comes after its migrations.
      server:
        condition: service_healthy

volumes:
  pgdata:
